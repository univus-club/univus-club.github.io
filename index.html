<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Univ-Us</title>
<meta name="description" content="Univ-Us 대학연합동아리의 활동 기록. 기수마다 은하가 생기고, 활동 하나가 별 하나가 됩니다.">
<meta property="og:title" content="Univ-Us">
<meta property="og:description" content="우리가 함께 지나온 시간이 별이 되는 곳">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1430'/%3E%3Cpath d='M16 6l2.2 7.8L26 16l-7.8 2.2L16 26l-2.2-7.8L6 16l7.8-2.2z' fill='%23e9edf7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@200;400&family=Barlow:wght@400;500&family=Gothic+A1:wght@200;400;500&display=swap">
<style>
/* Hallmark · shape: app screen · genre: atmospheric · theme: Darkroom (deal 1/3, seed university-club-archive-where-d972·b21e13c0·2026-11-04·r0) · redesign: restyle
 * nav: kept · signature: kept, the cohort galaxies as a star map · states: default, hover, focus-visible, active, disabled, selected, error · darkroom: amber, the night palette kept by request, type and controls from the theme
 * axes: dark/display-condensed/chromatic-amber · posture: restrained · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R5 V3 · weakest: V, the palette is kept by request so the sky matches the last build; the change lives in the type and the controls */
/* Hallmark · dismissed 40 · the 3.38:1 pairs are disabled buttons and fields, which WCAG 1.4.3 exempts, and each also changes fill and cursor */
/* Hallmark · answered F7 · the six selectors are one role, the form field, so they share one recipe on purpose */
/* Hallmark · dismissed render · this build machine cannot reach fonts.googleapis.com; the faces were checked with local copies of the same families */
/* 글꼴과 조작 요소만 Darkroom(암실) 방식으로: 가는 장체 제목, 사각 버튼, 1px 선, 앰버는 주 버튼 하나에만.
   색은 '한밤' 그대로. 테마를 바꾸려면 아래 :root 토큰만 고치면 돼요. */
:root{
  color-scheme: dark;
  /* 하늘 (app.js도 이 값을 읽어요) */
  --sky-0:#03050b; --sky-1:#0b1128;
  /* 패널과 글자 */
  --color-paper:#11162e; --color-paper-2:#151a36; --color-paper-3:#1b2142; --color-field:#0c1024;
  --color-ink:#e6e8f2; --color-ink-2:#c3c7dc; --color-muted:#9aa0bf; --color-faint:#6d7396;
  --color-rule:rgba(170,176,230,.2); --color-rule-strong:rgba(170,176,230,.45);
  --color-hover:rgba(230,232,242,.06); --color-scrim:rgba(3,5,11,.94);
  /* 안전등: 주 버튼, 선택된 칸, 포커스에만 */
  --color-accent:#ffd98f; --color-accent-hi:#ffe6b3; --color-accent-deep:#c9a35c; --color-accent-ink:#1a1405;
  --color-accent-tint:rgba(255,217,143,.1); --color-focus:#ffd98f;
  --color-error:#ff9a8a; --color-error-rule:rgba(255,154,138,.5); --color-success:#8fe3b4;
  /* 글꼴: 영문·숫자는 Darkroom, 한글은 같은 결의 Gothic A1 */
  --font-display:"Sofia Sans Extra Condensed","Gothic A1",sans-serif;
  --font-body:"Barlow","Gothic A1",sans-serif;
  --f-hand:var(--font-display); --f-text:var(--font-body); --map-label-scale:.82;
  --display-weight:200; --tracking-display:-0.005em;
  /* 크기와 간격 (4px 단위) */
  --text-xs:.75rem; --text-sm:.875rem; --text-md:1rem; --text-body:1.0625rem; --text-lg:1.2rem; --text-xl:1.44rem; --text-2xl:1.728rem; --text-3xl:2.074rem; --text-4xl:2.6rem;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px; --space-16:64px;
  --control-h:44px; --control-h-s:32px; --rule-hair:1px; --radius:0;
  --dur-micro:120ms; --dur-panel:350ms; --ease-out:cubic-bezier(.16,1,.3,1);
  --panel-w:460px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow-x:clip}
body{overflow-y:hidden;background:var(--sky-0);color:var(--color-ink);font-family:var(--font-body);font-size:var(--text-md);line-height:1.6;-webkit-font-smoothing:antialiased;caret-color:var(--color-accent)}
::selection{background:var(--color-accent-tint)}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.16em;text-decoration-color:var(--color-rule-strong)}
a:hover{text-decoration-color:var(--color-accent)}
a:active{color:var(--color-accent)}

#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sky.dragging{cursor:grabbing}
#sky.pointing{cursor:pointer}

/* ---------- 하늘 위 ---------- */
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + var(--space-4)) var(--space-4) 0;display:flex;flex-wrap:wrap;gap:var(--space-3) var(--space-5);align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:2}
.top > *{pointer-events:auto}
@media (min-width:641px){ body.panel-open .top{padding-right:calc(min(var(--panel-w),100%) + var(--space-4))} }
.brand h1{margin:0;font-family:var(--font-display);font-weight:var(--display-weight);font-size:var(--text-4xl);letter-spacing:var(--tracking-display);line-height:1;color:var(--color-ink)}
.brand p{margin:var(--space-2) 0 0;color:var(--color-muted);font-size:var(--text-sm)}
.actions{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.stats{font-size:var(--text-sm);color:var(--color-muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--color-ink);font-weight:500}

/* ---------- 버튼: 1px 테두리 보조 버튼 + 앰버 주 버튼, 둘 다 사각 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--control-h);padding:0 var(--space-5);
  border:var(--rule-hair) solid var(--color-accent);border-radius:var(--radius);background:var(--color-accent);color:var(--color-accent-ink);
  font:400 var(--text-lg)/1 var(--font-display);letter-spacing:.01em;white-space:nowrap;cursor:pointer;
  transition:background-color var(--dur-micro) var(--ease-out),border-color var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out),transform var(--dur-micro) var(--ease-out)}
.btn:hover{background:var(--color-accent-hi);border-color:var(--color-accent-hi)}
.btn:active{background:var(--color-accent-deep);border-color:var(--color-accent-deep);transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--color-ink);border-color:var(--color-ink-2)}
.btn.ghost:hover{background:var(--color-hover);border-color:var(--color-ink);color:var(--color-ink)}
.btn.ghost:active{background:var(--color-paper-3);transform:translateY(1px)}
.btn.danger{background:transparent;color:var(--color-error);border-color:var(--color-error-rule)}
.btn.danger:hover{background:var(--color-hover);border-color:var(--color-error)}
.btn.danger:active{background:var(--color-paper-3);transform:translateY(1px)}
.btn.small{min-height:var(--control-h-s);padding:0 var(--space-3);font-size:var(--text-md)}
.btn:disabled,.btn:disabled:hover,.btn:disabled:active{background:var(--color-paper-3);border-color:var(--color-rule);color:var(--color-faint);cursor:not-allowed;transform:none}
.badge{font-size:var(--text-md);color:inherit}

.dock{position:fixed;left:0;right:0;bottom:0;padding:0 var(--space-4) calc(env(safe-area-inset-bottom,0px) + var(--space-3));display:flex;gap:var(--space-1) var(--space-5);overflow-x:auto;scrollbar-width:none;pointer-events:none;z-index:2;align-items:baseline}
.dock::-webkit-scrollbar{display:none}
.dock > *{pointer-events:auto}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:var(--space-2);min-height:var(--control-h-s);padding:0;border:0;border-bottom:var(--rule-hair) solid transparent;background:none;cursor:pointer;font:400 var(--text-lg)/1 var(--font-display);white-space:nowrap;color:var(--color-muted)}
.chip:hover{color:var(--color-ink)}
.chip:active{color:var(--color-accent)}
.chip[aria-current="true"]{color:var(--color-ink);border-bottom-color:var(--color-ink)}
.chip i{width:8px;height:8px;border-radius:50%;display:block}
.chip small{color:var(--color-muted);font:400 var(--text-sm)/1 var(--font-body);font-variant-numeric:tabular-nums}
.hint{font-size:var(--text-xs);color:var(--color-muted);white-space:nowrap}

.center-note{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,calc(100% - var(--space-8)));z-index:1;text-align:center;color:var(--color-ink)}
.center-note h2{font-family:var(--font-display);font-weight:var(--display-weight);font-size:var(--text-3xl);letter-spacing:var(--tracking-display);line-height:1.1;margin:0 0 var(--space-2)}
.center-note p{color:var(--color-muted);margin:0 0 var(--space-5);font-size:var(--text-sm)}

.banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + var(--space-16));width:min(520px,calc(100% - var(--space-8)));padding:var(--space-3) var(--space-4);background:var(--color-paper-2);border:var(--rule-hair) solid var(--color-rule-strong);color:var(--color-muted);font-size:var(--text-sm);z-index:3}
.banner b{color:var(--color-ink);font-weight:500}
.banner a{white-space:nowrap}
.banner code{font-family:inherit;color:var(--color-ink);background:var(--color-paper-3);padding:0 var(--space-1);white-space:nowrap}
body.panel-open .banner{display:none}

/* ---------- 패널 ---------- */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(var(--panel-w),100%);background:var(--color-paper);color:var(--color-ink);border-left:var(--rule-hair) solid var(--color-rule-strong);
  transform:translateX(105%);transition:transform var(--dur-panel) var(--ease-out);display:flex;flex-direction:column;z-index:5}
.panel.open{transform:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);padding:calc(env(safe-area-inset-top,0px) + var(--space-2)) var(--space-3) var(--space-1) var(--space-4)}
.crumb{display:none}
.icon-btn{min-height:var(--control-h-s);border:0;background:none;cursor:pointer;color:var(--color-muted);font-size:var(--text-sm);padding:0 var(--space-1);text-decoration:underline;text-decoration-color:transparent;text-underline-offset:.2em}
.icon-btn:hover{color:var(--color-ink);text-decoration-color:var(--color-accent)}
.icon-btn:active{color:var(--color-accent)}
.panel-body{flex:1;overflow-y:auto;padding:var(--space-2) var(--space-6) calc(env(safe-area-inset-bottom,0px) + var(--space-8));display:flex;flex-direction:column;gap:var(--space-5);min-height:0}
.panel h2{font-family:var(--font-display);font-weight:var(--display-weight);font-size:var(--text-3xl);letter-spacing:var(--tracking-display);line-height:1.15;margin:0;color:var(--color-ink);text-wrap:balance;overflow-wrap:break-word;min-width:0}
.panel h3{font:400 var(--text-xl)/1.2 var(--font-display);margin:0;color:var(--color-ink)}
.sub{margin:var(--space-2) 0 0;font-size:var(--text-sm);color:var(--color-muted);text-wrap:pretty}
.stamp{display:inline-block;margin-left:var(--space-2);padding:0 var(--space-2);border:var(--rule-hair) solid var(--color-rule-strong);color:var(--color-ink-2);font-size:var(--text-xs);line-height:1.6;vertical-align:1px}
.meta{font-size:var(--text-sm);color:var(--color-muted);display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);margin:0}

.loglist{display:flex;flex-direction:column;border-top:var(--rule-hair) solid var(--color-rule)}
.logrow{display:grid;grid-template-columns:7em minmax(0,1fr);gap:0 var(--space-3);min-height:var(--control-h);padding:var(--space-3) var(--space-1);border:0;border-bottom:var(--rule-hair) solid var(--color-rule);background:none;text-align:left;cursor:pointer;align-items:baseline;color:var(--color-ink)}
.logrow:hover{background:var(--color-hover)}
.logrow:active{background:var(--color-paper-3)}
.logrow .d{font-size:var(--text-sm);color:var(--color-muted);font-variant-numeric:tabular-nums}
.logrow .t{font:400 var(--text-xl)/1.2 var(--font-display);min-width:0;overflow-wrap:break-word}
.logrow .a{grid-column:2;font-size:var(--text-xs);color:var(--color-faint)}
.empty-line{color:var(--color-muted);font-size:var(--text-sm);margin:0}
.locked{border:var(--rule-hair) solid var(--color-rule-strong);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);align-items:flex-start}
.locked p{margin:0;color:var(--color-muted);font-size:var(--text-sm)}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--space-3)}
.photos.one{grid-template-columns:minmax(0,1fr)}
.photos button{padding:0;border:0;margin:0;background:var(--color-paper-3);aspect-ratio:4/3;max-width:100%;cursor:zoom-in}
.photos button:hover img{opacity:.88}
.photos.one button{aspect-ratio:auto}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos.one img{height:auto;max-height:60vh;object-fit:contain}
.body-text{white-space:pre-wrap;overflow-wrap:break-word;max-width:60ch;margin:0;font-size:var(--text-body);line-height:1.7;color:var(--color-ink)}
.row{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.confirm{font-size:var(--text-sm);color:var(--color-error)}
.section{display:flex;flex-direction:column;gap:var(--space-3);padding-top:var(--space-5);border-top:var(--rule-hair) solid var(--color-rule)}
.section > p{margin:0;font-size:var(--text-sm);color:var(--color-muted)}
.pwlist{display:flex;flex-direction:column}
.pwrow{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-3);align-items:center;justify-content:space-between;padding:var(--space-3) 0;border-bottom:var(--rule-hair) solid var(--color-rule)}
.pwrow .l{display:flex;flex-direction:column;min-width:0}
.pwrow .l > span{font:400 var(--text-xl)/1.2 var(--font-display)}
.pwrow .l small{font-size:var(--text-xs);color:var(--color-faint)}
.linkbox{flex-basis:100%;min-width:0;overflow-x:auto;background:var(--color-field);border:var(--rule-hair) solid var(--color-rule);padding:var(--space-2) var(--space-3)}
.joinlink{font-size:var(--text-sm);white-space:nowrap;user-select:all;color:var(--color-ink);font-variant-numeric:tabular-nums}
.pwrow > .row,.pwrow > .msg{flex-basis:100%}
.meter{height:4px;background:var(--color-rule);overflow:hidden}
.meter i{display:block;height:100%;background:var(--color-ink-2)}

/* 별 꾸미기: 1px 칸, 고른 칸만 안전등 */
fieldset.look{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-3);min-width:0}
fieldset.look legend{font-size:var(--text-sm);color:var(--color-muted);padding:0;margin-bottom:var(--space-2)}
canvas.preview{width:100%;max-width:100%;height:96px;display:block;border:var(--rule-hair) solid var(--color-rule)}
.pick{display:grid;gap:0;border-top:var(--rule-hair) solid var(--color-rule);border-left:var(--rule-hair) solid var(--color-rule)}
.pick.shapes{grid-template-columns:repeat(6,minmax(0,1fr))}
.pick.colors{grid-template-columns:repeat(8,minmax(0,1fr))}
@media (max-width:640px){.pick.colors{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pick .opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-1);min-width:0;min-height:64px;padding:var(--space-2) 0;border-right:var(--rule-hair) solid var(--color-rule);border-bottom:var(--rule-hair) solid var(--color-rule);cursor:pointer;font-size:var(--text-xs);color:var(--color-muted);background:transparent}
.pick .opt:hover{background:var(--color-hover);color:var(--color-ink)}
.pick .opt:active{background:var(--color-paper-3)}
.pick .opt.on{background:var(--color-accent-tint);color:var(--color-ink);box-shadow:inset 0 0 0 1px var(--color-accent)}
.pick .opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.pick .opt:has(input:focus-visible){outline:2px solid var(--color-focus);outline-offset:-2px}
.pick.shapes .opt canvas{width:34px;height:34px;background:var(--sky-1)}
.pick .swatch i{display:block;width:20px;height:20px;border-radius:50%;margin:var(--space-1) 0}

/* 입력칸: 사각, 1px 테두리 */
form{display:flex;flex-direction:column;gap:var(--space-4)}
label{display:flex;flex-direction:column;gap:var(--space-1);font-size:var(--text-sm);color:var(--color-muted)}
label.check{flex-direction:row;align-items:flex-start;gap:var(--space-2);color:var(--color-ink);font-size:var(--text-sm)}
label.check input{margin-top:var(--space-1);accent-color:var(--color-accent);width:16px;height:16px}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;min-height:var(--control-h);background:var(--color-field);border:var(--rule-hair) solid var(--color-faint);border-radius:var(--radius);padding:var(--space-2) var(--space-3);color:var(--color-ink);font-size:var(--text-md)}
textarea{min-height:150px;resize:vertical;line-height:1.7}
input:hover,select:hover,textarea:hover{border-color:var(--color-muted)}
input:focus,textarea:focus,select:focus{outline:var(--rule-hair) solid var(--color-accent);outline-offset:0;border-color:var(--color-accent)}
input:disabled,select:disabled,textarea:disabled{background:var(--color-paper-3);color:var(--color-faint);cursor:not-allowed}
input::placeholder,textarea::placeholder{color:var(--color-faint)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-4)}
.two > *{min-width:0}
.drop{border:var(--rule-hair) dashed var(--color-muted);padding:var(--space-4);text-align:center;color:var(--color-muted);font-size:var(--text-sm);cursor:pointer;background:var(--color-field)}
.drop:hover{border-color:var(--color-ink);color:var(--color-ink)}
.drop:active{background:var(--color-paper-3)}
.drop:focus-within{outline:2px solid var(--color-focus);outline-offset:2px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.thumbs{display:flex;gap:var(--space-3);flex-wrap:wrap}
.thumbs > div{position:relative;width:72px;height:72px;background:var(--color-paper-3);border:var(--rule-hair) solid var(--color-rule)}
.thumbs > div.removed{opacity:.3}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:calc(var(--space-2) * -1);right:calc(var(--space-2) * -1);width:24px;height:24px;border:var(--rule-hair) solid var(--color-ink-2);background:var(--color-paper);color:var(--color-ink);cursor:pointer;font-size:var(--text-xs);line-height:1}
.thumbs button:hover{border-color:var(--color-ink);background:var(--color-paper-3)}
.thumbs button:active{background:var(--color-field)}
.msg{font-size:var(--text-sm);margin:0}
.msg.err{color:var(--color-error)}
.msg.ok{color:var(--color-success)}
.fine{font-size:var(--text-sm);color:var(--color-faint);margin:0}

/* ---------- 다음 궤도 ---------- */
.btn .count{font:500 var(--text-sm)/1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--color-accent)}
.idea-form{gap:var(--space-2);padding-bottom:var(--space-5);border-bottom:var(--rule-hair) solid var(--color-rule)}
.idea-form textarea{min-height:72px}
.ideas{display:flex;flex-direction:column}
.ideas h3{font:400 var(--text-lg)/1.2 var(--font-display);color:var(--color-muted);margin:var(--space-4) 0 var(--space-1)}
.ideas h3:first-child{margin-top:0}
.idea{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);padding:var(--space-3) 0;border-bottom:var(--rule-hair) solid var(--color-rule);align-items:start}
.idea .t{font:400 var(--text-xl)/1.25 var(--font-display);color:var(--color-ink);min-width:0;overflow-wrap:break-word}
.idea .d{grid-column:1;margin:0;font-size:var(--text-sm);color:var(--color-ink-2);overflow-wrap:break-word}
.idea .m{grid-column:1;font-size:var(--text-xs);color:var(--color-faint)}
.idea .acts{grid-column:1 / -1;display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center;margin-top:var(--space-1)}
.idea.old .t,.idea.old .d{color:var(--color-faint)}
.idea.done .t{color:var(--color-success)}
.stamp.ok{border-color:var(--color-success);color:var(--color-success)}
.idea.flash{animation:idea-flash 1.2s var(--ease-out)}
@keyframes idea-flash{from{background:var(--color-accent-tint)}to{background:transparent}}
.cheer{grid-row:1 / span 3;grid-column:2;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;min-height:var(--control-h);padding:var(--space-1) var(--space-2);border:var(--rule-hair) solid var(--color-rule-strong);border-radius:var(--radius);background:transparent;color:var(--color-muted);cursor:pointer;transition:background-color var(--dur-micro) var(--ease-out),border-color var(--dur-micro) var(--ease-out)}
.cheer b{font:400 var(--text-xl)/1 var(--font-display);color:var(--color-ink);font-variant-numeric:tabular-nums}
.cheer span{font-size:var(--text-xs)}
.cheer:hover{border-color:var(--color-ink);background:var(--color-hover)}
.cheer:active{background:var(--color-paper-3)}
.cheer[aria-pressed="true"]{border-color:var(--color-accent);background:var(--color-accent-tint);color:var(--color-accent)}
.cheer[aria-pressed="true"] b{color:var(--color-accent)}
.cheer:disabled{border-color:var(--color-rule);color:var(--color-faint);background:transparent;cursor:not-allowed}
.cheer:disabled b{color:var(--color-faint)}
.linkish{border:0;background:none;padding:0;color:var(--color-ink-2);font:inherit;text-decoration:underline;text-decoration-color:var(--color-rule-strong);text-underline-offset:.16em;cursor:pointer}
.linkish:hover{color:var(--color-ink);text-decoration-color:var(--color-accent)}
.linkish:active{color:var(--color-accent)}

.lightbox{position:fixed;inset:0;background:var(--color-scrim);z-index:10;display:grid;place-items:center;padding:var(--space-4);cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}

@media (max-width:640px){
  .panel{top:auto;width:100%;height:84%;border-left:0;border-top:var(--rule-hair) solid var(--color-rule-strong);transform:translateY(105%)}
  .panel.open{transform:none}
  .panel-head{padding-top:var(--space-2)}
  .panel-body{padding-left:var(--space-4);padding-right:var(--space-4)}
  .brand h1{font-size:var(--text-3xl)}
  .hint{display:none}
  .two{grid-template-columns:minmax(0,1fr)}
  .stats{display:none}
}
@media (prefers-reduced-motion:reduce){ .panel,.btn,.cheer{transition:none} .idea.flash{animation:none} .btn:active,.btn.ghost:active,.btn.danger:active{transform:none} }
</style>
</head>
<body>
<canvas id="sky" aria-label="Univ-Us 우주 지도. 아래의 기수 이름이나 은하를 눌러 기록을 볼 수 있어요."></canvas>

<header class="top">
  <div class="brand">
    <h1>Univ-Us</h1>
    <p>우리가 함께 지나온 시간이 별이 되는 곳</p>
  </div>
  <div class="actions" id="actions"></div>
</header>

<nav class="dock" id="dock" aria-label="기수별 은하"></nav>
<div class="center-note" id="note"><p>하늘을 여는 중…</p></div>
<div class="banner" id="demoBanner" hidden></div>

<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-head">
    <button class="icon-btn" id="backBtn" type="button" hidden>← 뒤로</button>
    <span class="crumb" id="crumb"></span>
    <button class="icon-btn" id="closeBtn" type="button" style="margin-left:auto">닫기</button>
  </div>
  <div class="panel-body" id="pbody"></div>
</aside>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
